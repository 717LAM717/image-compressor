<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網拍照片上架助手</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #667085;
      --line: #d6dde8;
      --panel: #ffffff;
      --accent: #176b87;
      --accent-strong: #0f5368;
      --ok: #16794c;
      --warn: #b45309;
      --bad: #b42318;
      --shadow: 0 16px 42px rgba(24, 40, 61, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(23, 107, 135, 0.14), transparent 34%),
        linear-gradient(320deg, rgba(239, 182, 97, 0.16), transparent 32%),
        #f8fafc;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border: 1px solid rgba(23, 107, 135, 0.18);
      border-radius: 18px;
      background:
        radial-gradient(circle at 74% 22%, rgba(239, 159, 77, 0.35), transparent 26%),
        linear-gradient(145deg, #ffffff, #e6f3f6);
      box-shadow: 0 14px 30px rgba(24, 40, 61, 0.12);
      color: var(--accent);
    }

    .brand-icon svg {
      width: 42px;
      height: 42px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .settings {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(10px);
    }

    .settings-panel {
      display: grid;
      gap: 10px;
      max-width: 720px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-btn {
      min-height: 42px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--accent-strong);
      cursor: pointer;
      font-weight: 700;
    }

    .mode-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .mode-field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .mode-field.disabled {
      opacity: 0.42;
    }

    .settings label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      white-space: nowrap;
    }

    .settings input[type="number"] {
      width: 82px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
    }

    .settings .size-input {
      width: 96px;
    }

    .settings .checkbox-label {
      color: var(--ink);
      font-weight: 700;
    }

    .settings input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .quality-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .quality-control input[type="range"] {
      width: 116px;
      accent-color: var(--accent);
    }

    .dropzone {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 250px;
      padding: 28px;
      border: 2px dashed #9bb4c5;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow);
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .dropzone.dragging {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #eef8fb;
    }

    .drop-inner {
      display: grid;
      gap: 16px;
      justify-items: center;
      text-align: center;
    }

    .upload-mark {
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #e7f2f5;
      color: var(--accent);
    }

    .upload-mark svg {
      width: 38px;
      height: 38px;
    }

    .drop-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .drop-note {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      max-width: 620px;
    }

    .file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary,
    .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .secondary {
      color: var(--accent-strong);
      background: #fff;
      border-color: var(--line);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      color: var(--muted);
      line-height: 1.5;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1.2;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(24, 40, 61, 0.08);
    }

    .page-footer {
      display: grid;
      gap: 14px;
      justify-items: center;
      margin-top: 22px;
      padding: 22px 16px 4px;
      text-align: center;
    }

    .footer-line {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--accent-strong);
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
    }

    .contact-btn:hover {
      border-color: var(--accent);
      background: #eef8fb;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #e8edf4;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      color: #475467;
      background: #f7f9fc;
      font-weight: 700;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
    }

    .thumb {
      flex: 0 0 auto;
      width: 58px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      background: #edf2f7;
    }

    .filename {
      font-weight: 700;
      word-break: break-word;
    }

    .detail {
      display: grid;
      gap: 4px;
      min-width: 118px;
      color: var(--muted);
      line-height: 1.25;
    }

    .detail strong {
      color: var(--ink);
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .queued {
      color: #475467;
      background: #eef2f6;
    }

    .working {
      color: #0f5368;
      background: #def3f7;
    }

    .done {
      color: var(--ok);
      background: #e8f6ee;
    }

    .warning {
      color: var(--warn);
      background: #fff4df;
    }

    .error {
      color: var(--bad);
      background: #fee4e2;
    }

    .row-settings {
      display: grid;
      grid-template-columns: 78px 78px;
      gap: 7px;
      min-width: 178px;
    }

    .row-settings label {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .row-settings input[type="number"] {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
    }

    .row-settings .row-check {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .row-settings input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .progress {
      width: 100%;
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf2f7;
    }

    .bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ef9f4d);
      transition: width 140ms ease;
    }

    .empty {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 780px) {
      .app {
        width: min(100vw - 20px, 1120px);
        padding-top: 18px;
      }

      header {
        display: grid;
        align-items: start;
      }

      .brand {
        align-items: flex-start;
      }

      .settings-panel {
        max-width: none;
      }

      .mode-switch {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dropzone {
        min-height: 230px;
        padding: 20px;
      }
    }

    @media (max-width: 460px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .buttons,
      .primary,
      .secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M9 14.5A5.5 5.5 0 0 1 14.5 9h19A5.5 5.5 0 0 1 39 14.5v19a5.5 5.5 0 0 1-5.5 5.5h-19A5.5 5.5 0 0 1 9 33.5v-19Z" fill="white" stroke="currentColor" stroke-width="2.5"/>
            <path d="M15 31.5 21.2 25l4.6 4.5 3.8-4.1L35 31.5" stroke="#0f5368" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="31.5" cy="17.5" r="3.2" fill="#ef9f4d"/>
            <path d="M38.5 7.5v5m-2.5-2.5h5M12 40.5v3m-1.5-1.5h3" stroke="#ef9f4d" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>網拍照片上架助手</h1>
          <p class="subtitle">批次處理網拍上架照片，可分開調整尺寸、壓縮容量，所有照片都只在你的電腦處理。</p>
        </div>
      </div>
      <div class="settings-panel">
        <div class="mode-switch" aria-label="處理模式">
          <button class="mode-btn active" type="button" data-mode="resize">僅調整尺寸</button>
          <button class="mode-btn" type="button" data-mode="compress">僅壓縮容量</button>
          <button class="mode-btn" type="button" data-mode="advanced">進階混合</button>
        </div>
        <div class="settings" aria-label="處理設定">
          <span class="mode-field" data-modes="compress advanced">
            <label for="targetSize">每張小於</label>
            <input id="targetSize" type="number" min="0.1" max="20" step="0.1" value="1">
            <span>MB</span>
          </span>
          <span class="mode-field" data-modes="compress">
            <label for="qualityRange">品質</label>
            <span class="quality-control">
              <input id="qualityRange" type="range" min="1" max="100" step="1" value="85">
              <input id="qualityNumber" type="number" min="1" max="100" step="1" value="85">
            </span>
            <span>%</span>
          </span>
          <span class="mode-field" data-modes="resize advanced">
            <label for="resizeWidth">寬</label>
            <input id="resizeWidth" class="size-input" type="number" min="1" max="12000" step="1" placeholder="不指定">
            <span>px</span>
          </span>
          <span class="mode-field" data-modes="resize advanced">
            <label for="resizeHeight">高</label>
            <input id="resizeHeight" class="size-input" type="number" min="1" max="12000" step="1" placeholder="不指定">
            <span>px</span>
          </span>
          <span class="mode-field" data-modes="advanced">
            <label class="checkbox-label" for="keepAspect">
              <input id="keepAspect" type="checkbox" checked>
              保持比例
            </label>
          </span>
        </div>
      </div>
    </header>

    <section id="dropzone" class="dropzone">
      <input id="fileInput" class="file-input" type="file" accept="image/jpeg,.jpg,.jpeg" multiple>
      <div class="drop-inner">
        <div class="upload-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 16V4m0 0 5 5m-5-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 16.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <p class="drop-title">拖曳照片到這裡，或點一下選取</p>
          <p class="drop-note">可一次選多張 JPG / JPEG。壓縮後會自動產生 ZIP 檔，檔名前方加上 compressed_。</p>
        </div>
      </div>
    </section>

    <section class="actions" aria-label="操作">
      <div class="buttons">
        <button id="compressBtn" class="primary" type="button" disabled>
          <span aria-hidden="true">↓</span>
          開始處理照片
        </button>
        <button id="downloadBtn" class="primary" type="button" disabled hidden>
          <span aria-hidden="true">↓</span>
          下載 ZIP
        </button>
        <button id="clearBtn" class="secondary" type="button" disabled>清除清單</button>
      </div>
      <div id="status" class="status">尚未選取照片</div>
    </section>

    <section class="summary" aria-label="摘要">
      <div class="metric"><strong id="countMetric">0</strong><span>張照片</span></div>
      <div class="metric"><strong id="beforeMetric">0 MB</strong><span>原始總容量</span></div>
      <div class="metric"><strong id="afterMetric">0 MB</strong><span>處理後總容量</span></div>
      <div class="metric"><strong id="savedMetric">0%</strong><span>節省空間</span></div>
    </section>

    <section class="table-wrap" aria-label="照片清單">
      <table>
        <thead>
          <tr>
            <th>照片</th>
            <th>處理前</th>
            <th>處理後</th>
            <th>輸出尺寸</th>
            <th>狀態</th>
            <th>進度</th>
          </tr>
        </thead>
        <tbody id="fileRows">
          <tr><td class="empty" colspan="6">選取照片後，處理結果會顯示在這裡。</td></tr>
        </tbody>
      </table>
    </section>

    <footer class="page-footer">
      <p class="footer-line">幫你一次處理上架照片，不用一張張改、不用怕超過限制</p>
      <button id="contactBtn" class="contact-btn" type="button">如有客製化需求，歡迎來信</button>
    </footer>
  </main>

  <script>
    const MAX_CANVAS_SIDE = 8192;
    const encoderMime = "image/jpeg";
    const state = {
      items: [],
      zipBlob: null,
      zipName: "",
      mode: "resize",
      running: false
    };

    const els = {
      fileInput: document.getElementById("fileInput"),
      dropzone: document.getElementById("dropzone"),
      modeButtons: Array.from(document.querySelectorAll(".mode-btn")),
      modeFields: Array.from(document.querySelectorAll(".mode-field")),
      compressBtn: document.getElementById("compressBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      clearBtn: document.getElementById("clearBtn"),
      status: document.getElementById("status"),
      rows: document.getElementById("fileRows"),
      targetSize: document.getElementById("targetSize"),
      qualityRange: document.getElementById("qualityRange"),
      qualityNumber: document.getElementById("qualityNumber"),
      resizeWidth: document.getElementById("resizeWidth"),
      resizeHeight: document.getElementById("resizeHeight"),
      keepAspect: document.getElementById("keepAspect"),
      contactBtn: document.getElementById("contactBtn"),
      countMetric: document.getElementById("countMetric"),
      beforeMetric: document.getElementById("beforeMetric"),
      afterMetric: document.getElementById("afterMetric"),
      savedMetric: document.getElementById("savedMetric")
    };

    els.fileInput.addEventListener("change", () => addFiles(els.fileInput.files));
    els.compressBtn.addEventListener("click", compressAll);
    els.downloadBtn.addEventListener("click", downloadReadyZip);
    els.clearBtn.addEventListener("click", clearAll);
    els.contactBtn.addEventListener("click", () => {
      const address = ["pip9ki88", "gmail.com"].join("@");
      window.location.href = `mailto:${address}?subject=${encodeURIComponent("網拍照片上架助手客製化需求")}`;
    });
    els.modeButtons.forEach((button) => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });
    [els.qualityRange, els.qualityNumber].forEach((input) => {
      input.addEventListener("input", () => {
        const quality = clampQuality(input.value);
        els.qualityRange.value = quality;
        els.qualityNumber.value = quality;
        state.zipBlob = null;
        state.zipName = "";
        state.items.forEach(resetItemResult);
        render();
        updateControls();
      });
    });
    els.targetSize.addEventListener("input", () => {
      state.zipBlob = null;
      state.zipName = "";
      state.items.forEach(resetItemResult);
      render();
      updateControls();
    });
    [els.resizeWidth, els.resizeHeight, els.keepAspect].forEach((input) => {
      input.addEventListener("input", () => {
        state.zipBlob = null;
        applyGlobalResizeOptions();
        render();
        updateControls();
      });
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      els.dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        els.dropzone.classList.add("dragging");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      els.dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        els.dropzone.classList.remove("dragging");
      });
    });

    els.dropzone.addEventListener("drop", (event) => {
      addFiles(event.dataTransfer.files);
    });

    els.rows.addEventListener("change", handleRowSettingChange);

    function addFiles(fileList) {
      const files = Array.from(fileList || []).filter((file) => {
        const name = file.name.toLowerCase();
        return file.type === "image/jpeg" || name.endsWith(".jpg") || name.endsWith(".jpeg");
      });

      if (!files.length) {
        setStatus("請選取 JPG / JPEG 照片");
        return;
      }

      const newItems = files.map((file) => ({
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        file,
        name: file.name,
        before: file.size,
        originalWidth: null,
        originalHeight: null,
        after: null,
        width: null,
        height: null,
        resizeWidth: Math.max(0, Math.round(Number(els.resizeWidth.value) || 0)),
        resizeHeight: Math.max(0, Math.round(Number(els.resizeHeight.value) || 0)),
        keepAspect: els.keepAspect.checked,
        outputBlob: null,
        previewUrl: URL.createObjectURL(file),
        progress: 0,
        status: "queued",
        message: "等待中"
      }));

      state.items.push(...newItems);
      state.zipBlob = null;
      render();
      setStatus(`已加入 ${files.length} 張照片`);
      els.fileInput.value = "";
      loadOriginalDimensions(newItems);
    }

    async function compressAll() {
      if (!state.items.length || state.running) return;

      state.running = true;
      state.zipBlob = null;
      updateControls();
      const processingOptions = getProcessingOptions();
      let completed = 0;

      for (const item of state.items) {
        item.status = "working";
        item.message = "處理中";
        item.progress = 8;
        render();

        try {
          const result = await processImage(item.file, item, processingOptions, (progress) => {
            item.progress = progress;
            renderRow(item);
          });
          item.outputBlob = result.blob;
          item.after = result.blob.size;
          item.width = result.width;
          item.height = result.height;
          item.progress = 100;
          item.status = result.warning ? "warning" : "done";
          item.message = result.warning || "完成";
        } catch (error) {
          item.status = "error";
          item.message = error.message || "處理失敗";
          item.progress = 100;
        }

        completed += 1;
        setStatus(`已處理 ${completed} / ${state.items.length} 張`);
        render();
      }

      const readyItems = state.items.filter((item) => item.outputBlob);
      if (readyItems.length) {
        const zipBlob = await buildZip(readyItems.map((item) => ({
          name: makeOutputName(item.name),
          blob: item.outputBlob
        })));
        state.zipBlob = zipBlob;
        state.zipName = `jpg-compressed-${new Date().toISOString().slice(0, 10)}.zip`;
        setStatus(`完成，請按「下載 ZIP」儲存 ${readyItems.length} 張處理後照片`);
      } else {
        setStatus("沒有可下載的壓縮照片");
      }

      state.running = false;
      updateControls();
    }

    async function processImage(file, item, options, onProgress) {
      const image = await loadImage(file);
      item.originalWidth = image.naturalWidth;
      item.originalHeight = image.naturalHeight;

      if (options.mode === "resize") {
        const dimensions = getOutputDimensions(image.naturalWidth, image.naturalHeight, {
          ...getItemResizeOptions(item),
          keepAspect: true
        });
        if (dimensions.width === image.naturalWidth && dimensions.height === image.naturalHeight) {
          onProgress(100);
          return { blob: file, width: image.naturalWidth, height: image.naturalHeight };
        }
        const canvas = drawImage(image, dimensions.width, dimensions.height);
        const blob = await canvasToBlob(canvas, 1);
        onProgress(100);
        return { blob, width: dimensions.width, height: dimensions.height };
      }

      if (options.mode === "compress") {
        const canvas = drawImage(image, image.naturalWidth, image.naturalHeight);
        const result = options.targetBytes
          ? await compressCanvasToTarget(canvas, options.targetBytes, onProgress, options.quality, 0.2)
          : { blob: await canvasToBlob(canvas, options.quality), warning: "" };
        onProgress(100);
        return { ...result, width: image.naturalWidth, height: image.naturalHeight };
      }

      let { width, height } = getOutputDimensions(image.naturalWidth, image.naturalHeight, getItemResizeOptions(item));
      let canvas = drawImage(image, width, height);
      let result = options.targetBytes
        ? await compressCanvasToTarget(canvas, options.targetBytes, onProgress, 0.92, 0.36)
        : { blob: await canvasToBlob(canvas, options.quality), warning: "" };
      onProgress(100);
      return { ...result, width, height };
    }

    async function compressCanvasToTarget(canvas, targetBytes, onProgress, maxQuality, minQuality) {
      let high = Math.max(0.01, Math.min(1, maxQuality));
      let low = Math.min(minQuality, high);
      let best = await canvasToBlob(canvas, high);
      onProgress(22);

      if (best.size <= targetBytes) {
        return { blob: best, warning: "" };
      }

      if (high === low) {
        return {
          blob: best,
          warning: best.size <= targetBytes ? "" : "已用最低品質，仍超過目標"
        };
      }

      for (let i = 0; i < 10; i += 1) {
        const quality = (low + high) / 2;
        const blob = await canvasToBlob(canvas, quality);
        if (blob.size <= targetBytes) {
          best = blob;
          low = quality;
        } else {
          high = quality;
        }
        onProgress(22 + Math.round((i + 1) * 7));
      }

      if (best.size <= targetBytes) {
        return { blob: best, warning: "" };
      }

      const smallest = await canvasToBlob(canvas, minQuality);
      return {
        blob: smallest,
        warning: smallest.size <= targetBytes ? "" : "已用最低品質，仍超過目標"
      };
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const url = URL.createObjectURL(file);
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("無法讀取照片"));
        };
        image.src = url;
      });
    }

    async function loadOriginalDimensions(items) {
      for (const item of items) {
        try {
          const image = await loadImage(item.file);
          item.originalWidth = image.naturalWidth;
          item.originalHeight = image.naturalHeight;
          renderRow(item);
        } catch {
          item.status = "error";
          item.message = "無法讀取尺寸";
          renderRow(item);
        }
      }
    }

    function drawImage(image, width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { alpha: false });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(image, 0, 0, width, height);
      return canvas;
    }

    function canvasToBlob(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("瀏覽器無法輸出 JPG"));
        }, encoderMime, quality);
      });
    }

    async function buildZip(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      for (const file of files) {
        const safeName = sanitizeZipName(file.name);
        const nameBytes = encoder.encode(safeName);
        const crc = await crc32(file.blob);
        const size = file.blob.size;
        const localHeader = new Uint8Array(30 + nameBytes.length);
        const localView = new DataView(localHeader.buffer);

        localView.setUint32(0, 0x04034b50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0x0800, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, 0, true);
        localView.setUint16(12, 0, true);
        localView.setUint32(14, crc, true);
        localView.setUint32(18, size, true);
        localView.setUint32(22, size, true);
        localView.setUint16(26, nameBytes.length, true);
        localHeader.set(nameBytes, 30);
        localParts.push(localHeader, file.blob);

        const centralHeader = new Uint8Array(46 + nameBytes.length);
        const centralView = new DataView(centralHeader.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0x0800, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, 0, true);
        centralView.setUint16(14, 0, true);
        centralView.setUint32(16, crc, true);
        centralView.setUint32(20, size, true);
        centralView.setUint32(24, size, true);
        centralView.setUint16(28, nameBytes.length, true);
        centralView.setUint32(42, offset, true);
        centralHeader.set(nameBytes, 46);
        centralParts.push(centralHeader);

        offset += localHeader.length + size;
      }

      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, offset, true);

      return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
    }

    function makeCrcTable() {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i += 1) {
        let c = i;
        for (let k = 0; k < 8; k += 1) {
          c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        }
        table[i] = c >>> 0;
      }
      return table;
    }

    const crcTable = makeCrcTable();

    async function crc32(blob) {
      const bytes = new Uint8Array(await blob.arrayBuffer());
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i += 1) {
        crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function downloadReadyZip() {
      if (!state.zipBlob) return;
      downloadBlob(state.zipBlob, state.zipName || "jpg-compressed.zip");
      setStatus(`已送出下載：${state.zipName || "jpg-compressed.zip"}`);
    }

    function sanitizeZipName(name) {
      return name.replace(/[\\/:*?"<>|]+/g, "_");
    }

    function makeOutputName(name) {
      const dotIndex = name.lastIndexOf(".");
      const base = dotIndex > 0 ? name.slice(0, dotIndex) : name;
      return `compressed_${base}.jpg`;
    }

    function clearAll() {
      state.items.forEach((item) => URL.revokeObjectURL(item.previewUrl));
      state.items = [];
      state.zipBlob = null;
      state.zipName = "";
      render();
      setStatus("尚未選取照片");
    }

    function setMode(mode) {
      state.mode = mode;
      if (mode === "resize") {
        els.keepAspect.checked = true;
        els.qualityRange.value = 100;
        els.qualityNumber.value = 100;
      } else if (mode === "compress" && els.qualityRange.value === "100") {
        els.qualityRange.value = 85;
        els.qualityNumber.value = 85;
      }

      state.zipBlob = null;
      state.zipName = "";
      state.items.forEach(resetItemResult);
      applyGlobalResizeOptions();
      render();
      updateControls();
      setStatus(getModeStatusText());
    }

    function getModeStatusText() {
      if (state.mode === "resize") return "目前模式：僅調整尺寸，不限制檔案大小";
      if (state.mode === "compress") return "目前模式：僅壓縮容量，保持原始尺寸";
      return "目前模式：進階混合，同時調整尺寸與容量";
    }

    function getProcessingOptions() {
      return {
        mode: state.mode,
        targetBytes: getTargetBytes(),
        quality: clampQuality(els.qualityRange.value) / 100
      };
    }

    function getTargetBytes() {
      if (els.targetSize.value.trim() === "") return null;
      const mb = Math.max(0.1, Number(els.targetSize.value) || 1);
      return Math.round(mb * 1024 * 1024);
    }

    function clampQuality(value) {
      return Math.max(1, Math.min(100, Math.round(Number(value) || 85)));
    }

    function getResizeOptions() {
      return {
        width: Math.max(0, Math.round(Number(els.resizeWidth.value) || 0)),
        height: Math.max(0, Math.round(Number(els.resizeHeight.value) || 0)),
        keepAspect: els.keepAspect.checked
      };
    }

    function applyGlobalResizeOptions() {
      const options = getResizeOptions();
      state.items.forEach((item) => {
        item.resizeWidth = options.width;
        item.resizeHeight = options.height;
        item.keepAspect = options.keepAspect;
        resetItemResult(item);
      });
    }

    function getItemResizeOptions(item) {
      return {
        width: Math.max(0, Math.round(Number(item.resizeWidth) || 0)),
        height: Math.max(0, Math.round(Number(item.resizeHeight) || 0)),
        keepAspect: Boolean(item.keepAspect)
      };
    }

    function handleRowSettingChange(event) {
      const input = event.target.closest("[data-setting]");
      if (!input || state.running) return;

      const row = input.closest("tr");
      const item = row ? state.items.find((candidate) => candidate.id === row.id.replace("row-", "")) : null;
      if (!item) return;

      const setting = input.dataset.setting;
      if (setting === "resizeWidth") {
        item.resizeWidth = Math.max(0, Math.round(Number(input.value) || 0));
      } else if (setting === "resizeHeight") {
        item.resizeHeight = Math.max(0, Math.round(Number(input.value) || 0));
      } else if (setting === "keepAspect") {
        item.keepAspect = input.checked;
      }

      state.zipBlob = null;
      state.zipName = "";
      resetItemResult(item);
      renderRow(item);
      updateSummary();
      updateControls();
      setStatus("已更新單張照片設定，請重新壓縮");
    }

    function resetItemResult(item) {
      item.after = null;
      item.width = null;
      item.height = null;
      item.outputBlob = null;
      item.progress = 0;
      item.status = "queued";
      item.message = "等待中";
    }

    function getOutputDimensions(originalWidth, originalHeight, options) {
      const requestedWidth = options.width;
      const requestedHeight = options.height;
      let width = originalWidth;
      let height = originalHeight;

      if (requestedWidth || requestedHeight) {
        if (options.keepAspect) {
          const widthScale = requestedWidth ? requestedWidth / originalWidth : Infinity;
          const heightScale = requestedHeight ? requestedHeight / originalHeight : Infinity;
          const scale = Math.min(widthScale, heightScale, 1);
          width = Math.max(1, Math.round(originalWidth * scale));
          height = Math.max(1, Math.round(originalHeight * scale));
        } else {
          width = requestedWidth || originalWidth;
          height = requestedHeight || originalHeight;
        }
      }

      const sideScale = Math.min(1, MAX_CANVAS_SIDE / Math.max(width, height));
      if (sideScale < 1) {
        width = Math.round(width * sideScale);
        height = Math.round(height * sideScale);
      }

      return { width, height };
    }

    function render() {
      if (!state.items.length) {
        els.rows.innerHTML = '<tr><td class="empty" colspan="6">選取照片後，處理結果會顯示在這裡。</td></tr>';
      } else {
        els.rows.innerHTML = state.items.map(rowTemplate).join("");
      }
      updateSummary();
      updateControls();
    }

    function renderRow(item) {
      const row = document.getElementById(`row-${item.id}`);
      if (row) row.outerHTML = rowTemplate(item);
      updateSummary();
    }

    function rowTemplate(item) {
      const statusClass = {
        queued: "queued",
        working: "working",
        done: "done",
        warning: "warning",
        error: "error"
      }[item.status] || "queued";

      const dimensionDisabled = state.running || state.mode === "compress" ? "disabled" : "";
      const aspectDisabled = state.running || state.mode !== "advanced" ? "disabled" : "";
      const resizeWidth = item.resizeWidth || "";
      const resizeHeight = item.resizeHeight || "";
      const keepAspect = state.mode === "resize" || item.keepAspect ? "checked" : "";
      const beforeDimensions = item.originalWidth && item.originalHeight ? `${item.originalWidth} x ${item.originalHeight}` : "讀取中";
      const afterDimensions = item.width && item.height ? `${item.width} x ${item.height}` : "-";

      return `
        <tr id="row-${item.id}">
          <td>
            <div class="name-cell">
              <img class="thumb" src="${item.previewUrl}" alt="">
              <div class="filename">${escapeHtml(item.name)}</div>
            </div>
          </td>
          <td><div class="detail"><strong>${beforeDimensions}</strong><span>${formatBytes(item.before)}</span></div></td>
          <td><div class="detail"><strong>${afterDimensions}</strong><span>${item.after ? formatBytes(item.after) : "-"}</span></div></td>
          <td>
            <div class="row-settings">
              <label>寬
                <input data-setting="resizeWidth" type="number" min="1" max="12000" step="1" value="${resizeWidth}" placeholder="原圖" ${dimensionDisabled}>
              </label>
              <label>高
                <input data-setting="resizeHeight" type="number" min="1" max="12000" step="1" value="${resizeHeight}" placeholder="原圖" ${dimensionDisabled}>
              </label>
              <label class="row-check">
                <input data-setting="keepAspect" type="checkbox" ${keepAspect} ${aspectDisabled}>
                保持比例
              </label>
            </div>
          </td>
          <td><span class="pill ${statusClass}">${escapeHtml(item.message)}</span></td>
          <td><div class="progress"><div class="bar" style="width:${item.progress}%"></div></div></td>
        </tr>
      `;
    }

    function updateSummary() {
      const before = state.items.reduce((sum, item) => sum + item.before, 0);
      const after = state.items.reduce((sum, item) => sum + (item.after || 0), 0);
      const saved = before && after ? Math.max(0, Math.round((1 - after / before) * 100)) : 0;
      els.countMetric.textContent = state.items.length.toString();
      els.beforeMetric.textContent = formatBytes(before);
      els.afterMetric.textContent = formatBytes(after);
      els.savedMetric.textContent = `${saved}%`;
    }

    function updateControls() {
      els.modeButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === state.mode);
        button.disabled = state.running;
      });
      els.modeFields.forEach((field) => {
        const modes = (field.dataset.modes || "").split(" ");
        const active = modes.includes(state.mode);
        field.classList.toggle("disabled", !active);
        field.querySelectorAll("input").forEach((input) => {
          input.disabled = state.running || !active;
        });
      });

      els.compressBtn.disabled = !state.items.length || state.running;
      els.downloadBtn.hidden = !state.zipBlob;
      els.downloadBtn.disabled = !state.zipBlob || state.running;
      els.clearBtn.disabled = !state.items.length || state.running;
      if (state.mode === "resize") {
        els.keepAspect.checked = true;
        els.qualityRange.value = 100;
        els.qualityNumber.value = 100;
      }
    }

    function setStatus(message) {
      els.status.textContent = message;
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 MB";
      const mb = bytes / 1024 / 1024;
      if (mb >= 0.1) return `${mb.toFixed(2)} MB`;
      return `${(bytes / 1024).toFixed(0)} KB`;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    updateControls();
    setStatus(getModeStatusText());
  </script>
</body>
</html>
